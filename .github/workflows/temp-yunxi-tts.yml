name: Temporary Yunxi Narration

on:
  push:
    branches:
      - temp-yunxi-tts-20260801
    paths:
      - 'tmp_tts/**'
      - '.github/workflows/temp-yunxi-tts.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-yunxi-tts-20260801
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Edge TTS
        run: python -m pip install --upgrade pip edge-tts
      - name: Generate six narration segments
        run: python tmp_tts/generate_yunxi.py
      - name: Commit generated narration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.mp3
          git diff --cached --quiet || git commit -m "Generate Yunxi narration audio"
          git push origin HEAD:temp-yunxi-tts-20260801
